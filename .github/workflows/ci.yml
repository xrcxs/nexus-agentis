name: NEXUS//AGENTIS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Ruff lint
        run: ruff check backend eval
      - name: Mypy strict type-check
        run: mypy backend/models backend/services backend/graph backend/app
      - name: Run unit & integration tests (pytest + unittest)
        env:
          NEXUS_STUB_APIS: "true"
        run: |
          PYTHONPATH=. pytest -v
          PYTHONPATH=. python3 -m unittest backend/tests/test_unit.py backend/tests/test_integration.py -v
      - name: Run 10-question pipeline smoke benchmark (stubbed APIs; plumbing only, not quality)
        env:
          NEXUS_STUB_APIS: "true"
        run: make eval

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Lint & Typecheck
        working-directory: frontend
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
