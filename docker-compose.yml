services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - NEXUS_LEDGER_SECRET=${NEXUS_LEDGER_SECRET:-change-me-in-production-hmac-secret}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - NEXUS_STUB_APIS=${NEXUS_STUB_APIS:-false}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080
      - NEXUS_DB_PATH=/data/nexus_agentis.db
      - NEXUS_CHECKPOINT_DB_PATH=/data/nexus_checkpoints.db
    volumes:
      - nexus_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nexus_data:
